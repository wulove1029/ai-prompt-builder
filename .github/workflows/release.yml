name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure update repository
        shell: pwsh
        run: |
          $path = "gstack_prompt_builder.py"
          $content = Get-Content $path -Raw
          $content = $content.Replace("YOUR_GITHUB_USERNAME/ai-prompt-builder", "${{ github.repository }}")
          Set-Content $path $content -Encoding UTF8

      - name: Build EXE
        run: pyinstaller "gstack Prompt Builder.spec"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI Prompt Builder
          path: "dist/AI Prompt Builder.exe"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/AI Prompt Builder.exe"
